name: wifi_ftm
description: A Flutter plugin for WiFi Fine Timing Measurement (FTM) and Round-Trip-Time (RTT) ranging, supporting both 802.11mc and 802.11az (Android 15+).
version: 0.2.0
homepage: https://pub.dev/packages/wifi_ftm/
repository: https://github.com/RayLabz/wifi_ftm
issue_tracker: https://github.com/RayLabz/wifi_ftm/issues

platforms:
  android:

funding:
  - https://buymeacoffee.com/nkasenides

topics:
  - wifi
  - ftm
  - rtt
  - positioning
  - ranging

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: com.raylabz.wifi_ftm
        pluginClass: WifiFtmPlugin
